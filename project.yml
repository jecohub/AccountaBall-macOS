name: AccountaBall
options:
  deploymentTarget:
    macOS: "14.0"
  bundleIdPrefix: com.jerico
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  AccountaBall:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AccountaBall
        excludes:
          - "**/*.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jerico.AccountaBall
        CODE_SIGN_ENTITLEMENTS: AccountaBall/AccountaBall.entitlements
        INFOPLIST_FILE: AccountaBall/Info.plist
        INFOPLIST_KEY_NSScreenCaptureUsageDescription: "AccountaBall reads your screen to check if you're on task."
        INFOPLIST_KEY_NSUserNotificationsUsageDescription: "AccountaBall sends nudges when you drift off task."
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: YES
    entitlements:
      path: AccountaBall/AccountaBall.entitlements

  AccountaBallTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: AccountaBallTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jerico.AccountaBallTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/AccountaBall.app/Contents/MacOS/AccountaBall"
        BUNDLE_LOADER: "$(TEST_HOST)"
    dependencies:
      - target: AccountaBall
